services:
    db:
        image: postgres:17
        # env variables from .env file
        environment:
            POSTGRES_USER: ${USER}
            POSTGRES_PASSWORD: ${PASSWORD}
            POSTGRES_DB: ${DATABASE}
        env_file:
            - .env
        ports:
            - "5432:5432"
        # named  volume  that allows data in db to persist even after destruction of container
        volumes:
            - pg-data:/var/lib/postgresql/data

    redis:
        image: redis:7
        container_name: my-redis
        ports:
            - '6379:6379'

    web:
        build: .
        # allows db and redis to start first before the web app to avoid errors
        depends_on:
            - db
            - redis
        volumes:
            - .:/usr/src/app
        ports:
            - "8000:8000"
volumes:
    pg-data: